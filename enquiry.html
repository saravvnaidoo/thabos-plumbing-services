    <main>
      <section class="section">
        <div class="container">
          <div class="section-heading">
            <h1>Send an Enquiry</h1>
            <p>Tell us about your plumbing issue and we will get back to you promptly.</p>
            <p class="urgent-note">
              Is it urgent? Call us on
              <a href="tel:+27314567890">031 456 7890</a>.
            </p>
          </div>

          <h2>Book a Service</h2>

          <div class="form-wrap">
            <form id="enquiryForm" novalidate>
              <div class="form-grid">
                <div class="form-field">
                  <label for="name">Full name</label>
                  <input id="name" name="name" type="text" placeholder="Your full name" required />
                </div>

                <div class="form-field">
                  <label for="email">Email address</label>
                  <input id="email" name="email" type="email" placeholder="you@example.com" required />
                </div>

                <div class="form-field">
                  <label for="phone">Phone number</label>
                  <input
                    id="phone"
                    name="phone"
                    type="tel"
                    inputmode="numeric"
                    pattern="[0-9]{10}"
                    title="Please enter a 10-digit phone number"
                    placeholder="0791234567"
                    required
                  />
                </div>

                <div class="form-field">
                  <label for="service">Service needed</label>
                  <select id="service" name="service" required>
                    <option value="">Please select</option>
                    <option value="Pipe Repairs">Pipe Repairs</option>
                    <option value="Underground Pipework Installation">Underground Pipework Installation</option>
                    <option value="Drain Clearing">Drain Clearing</option>
                    <option value="Bathroom Plumbing">Bathroom Plumbing</option>
                    <option value="Kitchen Plumbing">Kitchen Plumbing</option>
                    <option value="General Maintenance">General Maintenance</option>
                  </select>
                </div>

                <div class="form-field full">
                  <label for="message">Message</label>
                  <textarea id="message" name="message" placeholder="Briefly describe the plumbing issue" required></textarea>
                </div>
              </div>

              <div class="hero-actions">
                <button class="button" type="submit">Submit Enquiry</button>
              </div>
            </form>
          </div>
        </div>
      </section>
